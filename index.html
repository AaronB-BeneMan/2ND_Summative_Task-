<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Shop</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f0ea;
    color:#333;
    text-align:center;
}

.header{
    padding:30px;
}

.header img{
    border-radius:50%;
    box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.header h1{
    margin-top:15px;
    color:#6f4e37;
    font-size:42px;
}

.header p{
    margin-top:10px;
    font-size:18px;
}

.container{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    max-width:1100px;
    margin:30px auto;
}

.item{
    background:#fff;
    padding:20px;
    border-radius:15px;
    width:220px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    transition:.3s;
}

.item:hover{
    transform:translateY(-8px);
}

.item img{
    border-radius:10px;
    margin-bottom:10px;
}

.item h3{
    color:#6f4e37;
    margin:10px 0;
}

.item b{
    font-size:20px;
}

button{
    margin-top:12px;
    padding:10px 20px;
    border:none;
    border-radius:30px;
    background:#6f4e37;
    color:#fff;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#8b5a2b;
    transform:scale(1.05);
}


/* Sticky Nav Area */

.checkout-area{
    max-width:1100px;
    margin:auto;
}

.nav{
    position:sticky;
    top:0;
    z-index:1000;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;

    padding:15px;
    background:#f5f0ea;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.nav button,
.nav a{
    width:160px;
    height:45px;
    display:flex;
    justify-content:center;
    align-items:center;

    padding:0;
    border:none;
    border-radius:30px;

    background:#6f4e37;
    color:white;
    font-size:16px;
    cursor:pointer;
    text-decoration:none;

    transition:.3s;
    margin:10px;
}

.nav button:hover,
.nav a:hover{
    background:#8b5a2b;
    transform:scale(1.05);
}


/* Cart */

#cart{
    max-width:900px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

#cart h2{
    color:#6f4e37;
    margin-bottom:20px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.cart-item button{
    padding:5px 12px;
    margin-left:10px;
    border-radius:8px;
}

.total{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    color:#6f4e37;
}


/* Mobile Responsive */

@media (max-width:600px){

    .header{
        padding:20px;
    }

    .header img{
        width:120px;
        height:120px;
    }

    .header h1{
        font-size:30px;
    }

    .header p{
        font-size:14px;
    }

    .container{
        flex-direction:column;
        align-items:center;
        gap:15px;
    }

    .item{
        width:90%;
        max-width:350px;
    }

    .item img{
        width:130px;
        height:130px;
    }

    .nav{
        flex-direction:column;
        align-items:center;
        padding:10px;
    }

    .nav button,
    .nav a{
        width:90%;
        max-width:300px;
        height:45px;
        margin:5px;
    }

    #cart{
        width:90%;
        margin:25px auto;
        padding:20px;
    }

    .cart-item{
        flex-direction:column;
        gap:10px;
        text-align:center;
    }

    .total{
        font-size:20px;
    }

}

</style>
</head>

<body>

<div class="header">
    <img src="LogoShop.jpg" width="180" height="180">
    <h1>CoffeeBiz</h1>
    <p>Freshly Brewed Happiness Every Day ☕</p>
</div>


<div class="container">

<div class="item">
<img src="blackkopi.jpg" width="150" height="150">
<h3>Black Coffee</h3>
<b>₱30</b><br>
<button onclick="addToCart('Black Coffee')">Add to Cart</button>
</div>

<div class="item">
<img src="hotchoco.jpg" width="150" height="150">
<h3>Hot Chocolate</h3>
<b>₱35</b><br>
<button onclick="addToCart('Hot Chocolate')">Add to Cart</button>
</div>

<div class="item">
<img src="matcha.jpg" width="150" height="150">
<h3>Matcha Milk</h3>
<b>₱50</b><br>
<button onclick="addToCart('Matcha Milk')">Add to Cart</button>
</div>

<div class="item">
<img src="latte.jpg" width="150" height="150">
<h3>Cafe Latte</h3>
<b>₱65</b><br>
<button onclick="addToCart('Cafe Latte')">Add to Cart</button>
</div>

<div class="item">
<img src="espresso.jpg" width="150" height="155">
<h3>Espresso</h3>
<b>₱55</b><br>
<button onclick="addToCart('Espresso')">Add to Cart</button>
</div>

<div class="item">
<img src="icedcoffee.jpg" width="150" height="150">
<h3>Iced Coffee</h3>
<b>₱60</b><br>
<button onclick="addToCart('Iced Coffee')">Add to Cart</button>
</div>

</div>


<div class="checkout-area">

<div class="nav">
    <a href="index.html">Cancel/Return</a>
    <button onclick="Thankyou()">Place Order</button>
</div>


<div id="cart">
    <h2>Shopping Cart</h2>
    <div id="cart-items"></div>

    <div class="total">
        Total: ₱<span id="total">0</span>
    </div>
</div>

</div>


<script>

const PRICES = {
    "Black Coffee":30,
    "Hot Chocolate":35,
    "Matcha Milk":50,
    "Cafe Latte":65,
    "Espresso":55,
    "Iced Coffee":60
};

let cart=[];
let total=0;


function addToCart(name){

    const price=PRICES[name];

    let item=cart.find(product=>product.name===name);

    if(item){
        item.quantity++;
    }else{
        cart.push({
            name:name,
            price:price,
            quantity:1
        });
    }

    updateCart();
}


function removeFromCart(name){

    let index=cart.findIndex(product=>product.name===name);

    if(index===-1)return;

    if(cart[index].quantity>1){
        cart[index].quantity--;
    }else{
        cart.splice(index,1);
    }

    updateCart();
}


function updateCart(){

    const cartItems=document.getElementById("cart-items");

    cartItems.innerHTML="";

    total=0;

    cart.forEach(item=>{

        total+=item.price*item.quantity;

        cartItems.innerHTML+=`
        <div class="cart-item">
            <span>${item.name} x ${item.quantity}</span>

            <span>
                ₱${item.price*item.quantity}
                <button onclick="removeFromCart('${item.name}')">-</button>
            </span>
        </div>`;
    });


    document.getElementById("total").innerText=total;
}


function Thankyou(){

    if(cart.length===0){

        alert("Your cart is empty!");

    }else{

        alert("Thank you for your order! Your total is ₱"+total);

        cart=[];
        total=0;

        updateCart();
    }

}

</script>

</body>
</html>
